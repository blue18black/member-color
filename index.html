<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハロプロメンバーカラークイズ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="homeScreen" class="screen">
    <h1>ハロー！プロジェクト<br>メンバーカラークイズ</h1>
    <!-- グループカードは data/members.json から script.js が生成する -->
    <div id="groupCarousel"></div>
</div>
<div id="startScreen" class="screen hidden">

    <h2 id="groupTitle"></h2>

    <div id="memberCarousel">

        <img id="carouselImage" fetchpriority="high" alt="">

        <div id="carouselName"></div>

    </div>

    <p id="questionCount"></p>

    <button class="menu-btn primary" onclick="startQuiz()">スタート</button>
    <button class="menu-btn" onclick="goHome()">ホームへ</button>
</div>

<div id="quizScreen" class="screen hidden">

    <div id="progress"></div>

    <img id="memberImage">

    <h2 id="memberName"></h2>

    <div id="colorGrid"></div>

    <button class="menu-btn" id="skipBtn" onclick="skipQuestion()">わからない</button>
    <button class="menu-btn" id="homeBtn" onclick="goHome()">ホームへ</button>

</div>

<div id="resultScreen" class="screen hidden">

    <h2>結果</h2>

    <p id="scoreText"></p>
    <button class="menu-btn primary" onclick="startQuiz()">もう一度挑戦</button>
    <button class="menu-btn" onclick="goHome()">ホームへ</button>
    <div id="results"></div>
</div>

<div id="overlay" class="hidden"></div>

<script src="script.js"></script>

</body>
</html>
