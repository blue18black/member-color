<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハロプロメンバーカラークイズ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="homeScreen" class="screen">
    <h1>ハロプロメンバーカラークイズ</h1>
    <div id="groupCarousel">
        <div class="group-card"
            onclick="selectGroup('morning')">
            <img src="images/group_morning.webp">
            <h2>モーニング娘。'26</h2>
        </div>
        <div class="group-card"
            onclick="selectGroup('ange')">
            <img src="images/group_ange.webp">
            <h2>アンジュルム</h2>
        </div>
        <div class="group-card"
            onclick="selectGroup('juice')">
            <img src="images/group_juice.webp">
            <h2>Juice=Juice</h2>
        </div>
        <div class="group-card"
            onclick="selectGroup('tsubaki')">
            <img src="images/group_tsubaki.webp">
            <h2>つばきファクトリー</h2>
        </div>
        <div class="group-card"
            onclick="selectGroup('beyo')">
            <img src="images/group_beyo.webp">
            <h2>BEYOOOOONDS</h2>
        </div>
        <div class="group-card"
            onclick="selectGroup('ocha')">
            <img src="images/group_ocha.webp">
            <h2>OCHA NORMA</h2>
        </div>
        <div class="group-card"
            onclick="selectGroup('rosy')">
            <img src="images/group_rosy.webp">
            <h2>ロージークロニクル</h2>
        </div>
        <!-- <div class="group-card"
            onclick="selectGroup('all')">
            <img src="images/group_all.webp">
            <h2>全グループ混合</h2>
        </div> -->
    </div>
</div>

<div id="startScreen" class="screen hidden">

    <h2 id="groupTitle"></h2>

    <div id="memberCarousel">

        <img id="carouselImage">

        <div id="carouselName"></div>

    </div>

    <p id="questionCount"></p>

    <button class="menu-btn" onclick="startQuiz()">スタート</button>
    <button class="menu-btn" onclick="goHome()">ホームへ</button>
</div>

<div id="quizScreen" class="screen hidden">

    <div id="progress"></div>

    <img id="memberImage">

    <h2 id="memberName"></h2>

    <div id="colorGrid"></div>

    <button class="menu-btn" id="skipBtn" onclick="skipQuestion()">わからない</button>
    <button class="menu-btn" onclick="goHome()">ホームへ</button>

</div>

<div id="resultScreen" class="screen hidden">

    <h2>結果</h2>

    <p id="scoreText"></p>
    <button class="menu-btn" onclick="startQuiz()">もう一度挑戦</button>
    <button class="menu-btn" onclick="goHome()">ホームへ</button>
    <div id="mistakes"></div>

    

</div>

<div id="overlay" class="hidden"></div>

<script src="script.js"></script>

</body>
</html>
